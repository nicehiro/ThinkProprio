[project]
name = "thinkproprio"
version = "0.1.0"
description = "Think Proprioceptively: State-Grounded Visual Token Selection for VLA Policies"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "bddl>=1.0.1",
    "calvin-env",
    "cloudpickle>=2.1.0",
    "easydict>=1.9",
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "future>=0.18.2",
    "gitpython>=3.1.46",
    "gym==0.26.2",
    "hydra-colorlog>=1.2.0",
    "hydra-core==1.1.1",
    "libero",
    "matplotlib>=3.9.4",
    "mmh3>=4.0.0",
    "moviepy>=2.2.1",
    "mujoco==2.3.7",
    "numpy==1.26.4",
    "omegaconf==2.1.2",
    "opencv-python==4.11.0.86",
    "pytorch-lightning==2.0.8",
    "robomimic>=0.2.0",
    "robosuite>=1.4.0",
    "scipy>=1.13.1",
    "sentence-transformers==2.2.2",
    "termcolor>=3.1.0",
    "timm==1.0.24",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "pybullet==3.2.7",
    "safetensors==0.7.0",
    "setuptools==80.10.2",
    "torchdiffeq>=0.2.5",
    "torchsde>=0.2.6",
    "transformers==4.44.2",
    "tqdm>=4.67.2",
    "wandb>=0.24.1",
    "flash-attn==2.6.3",
]

[tool.uv]
override-dependencies = ["nvidia-cublas-cu12==12.4.5.8"]
config-settings-package = { libero = { editable_mode = "compat" } }

[tool.uv.sources]
calvin-env = { path = "./calvin_env", editable = true }
libero = { path = "./LIBERO", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.6.3/flash_attn-2.6.3%2Bcu123torch2.2cxx11abiFALSE-cp39-cp39-linux_x86_64.whl" }
